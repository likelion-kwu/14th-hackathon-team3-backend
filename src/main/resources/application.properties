spring.application.name=likelion-hackathon
spring.config.import=optional:classpath:application-secret.properties

openai.base-url=https://api.openai.com/v1
openai.model=${OPENAI_MODEL:gpt-5.6-luna}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}

workspace.invitation-base-url=${WORKSPACE_INVITATION_BASE_URL:https://14th-hackathon-team3-frontend-mhjk.vercel.app/invite}

# 이슈 첨부파일. 명세 기준 파일당 20MB, 1회 5개까지 허용한다.
# 개별 파일 검증은 IssueFileService 에서 하므로 서블릿 한도는 여유 있게 잡는다.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=125MB
# 첨부파일 저장소. local(기본) 또는 s3.
file.storage=${FILE_STORAGE:local}
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
# S3 자격증명은 여기 두지 않는다. 환경변수(AWS_ACCESS_KEY_ID 등)나 IAM 역할로 주입한다.
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.region=${AWS_S3_REGION:us-east-1}
# 첨부파일 URL 앞에 붙는 서버 주소. 운영에서는 https://api.likelion-bato.cloud 로 넣는다.
file.public-base-url=${FILE_PUBLIC_BASE_URL:http://localhost:8080}
